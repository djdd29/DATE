<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DATE PORTAL</title>
    <style>
      :root {
        --bg: #090909;
        --bg-panel: #111111;
        --bg-soft: #1a1a1a;
        --bg-card: #141414;
        --border: #2f2f2f;
        --text: #f5f5f5;
        --muted: #bfbfbf;
        --red: #d51d1d;
        --red-soft: rgba(213, 29, 29, 0.18);
        --red-glow: rgba(213, 29, 29, 0.3);
        --white: #ffffff;
        --shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
        --radius: 22px;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background:
          radial-gradient(circle at top, rgba(213, 29, 29, 0.14), transparent 35%),
          linear-gradient(180deg, #050505 0%, #0c0c0c 100%);
        color: var(--text);
        overflow-x: hidden;
      }

      a { color: inherit; text-decoration: none; }
      button, input, select, textarea { font: inherit; }
      input, select, textarea {
        width: 100%;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.03);
        color: var(--text);
        border-radius: 14px;
        padding: 14px 16px;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }

      input:focus, select:focus, textarea:focus {
        border-color: rgba(213, 29, 29, 0.85);
        box-shadow: 0 0 0 4px rgba(213, 29, 29, 0.1);
      }

      .container {
        width: min(1200px, calc(100% - 28px));
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 22px 0 18px;
      }

      .brand-wrap {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: linear-gradient(135deg, #f5f5f5 0%, #8b8b8b 38%, #d31b1b 100%);
        display: grid;
        place-items: center;
        color: #0a0a0a;
        font-weight: 900;
        font-size: 1.6rem;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25), 0 12px 28px rgba(213,29,29,0.22);
      }

      .brand-name {
        font-size: clamp(1.2rem, 2vw, 2rem);
        letter-spacing: 0.06em;
        font-weight: 800;
      }

      .nav-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: linear-gradient(180deg, #e02b2b 0%, #a51111 100%);
        color: var(--white);
        border-radius: 12px;
        padding: 11px 20px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        box-shadow: 0 12px 28px rgba(213,29,29,0.3);
      }

      .btn:hover { filter: brightness(1.04); }
      .btn:active { transform: translateY(1px) scale(0.99); }

      .btn.secondary {
        background: #1d1d1d;
        border-color: var(--border);
        box-shadow: none;
      }

      .btn.ghost {
        background: rgba(255,255,255,0.01);
        border: 1px solid var(--border);
        box-shadow: none;
      }

      .btn.danger {
        background: linear-gradient(180deg, #2b2b2b, #111111);
        border-color: rgba(255,255,255,0.12);
      }

      .btn.success {
        background: linear-gradient(180deg, #6d1414 0%, #a31a1a 100%);
      }

      .page-shell {
        padding: 12px 0 42px;
      }

      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 28px 0 12px;
      }

      .hero-box {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        border: 1px solid rgba(255,255,255,0.12);
        background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        display: grid;
        place-items: center;
        margin-bottom: 18px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
      }

      .hero-box span {
        font-size: clamp(2.1rem, 4vw, 3.6rem);
        line-height: 1;
        font-weight: 900;
        color: #f2f2f2;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.3rem, 5vw, 5rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      .hero-sub {
        margin: 16px auto 0;
        font-size: clamp(1rem, 1.8vw, 1.35rem);
        max-width: 760px;
        line-height: 1.8;
        color: var(--muted);
      }

      .auth-grid {
        margin-top: 26px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 26px;
      }

      .panel {
        background: rgba(17,17,17,0.9);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 26px;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 22px;
      }

      .panel-header h2
      {
        margin: 0;
        font-size: clamp(1.5rem, 2vw, 2.4rem);
      }

      .mini-tag {
        color: var(--muted);
        font-size: 0.9rem;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.02);
        border-radius: 999px;
        padding: 7px 12px;
      }

      .field {
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        margin-bottom: 10px;
        color: #f0f0f0;
        font-weight: 700;
      }

      .password-wrap {
        position: relative;
      }

      .password-wrap input {
        padding-left: 52px;
      }

      .toggle-visibility {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }

      .toggle-visibility:hover { background: rgba(255,255,255,0.04); }

      .inline-small {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-top: 10px;
      }

      .admin-toggle-area {
        display: none;
        margin-top: 8px;
      }

      .admin-toggle-area.show { display: block; }

      .switch-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .simple-link {
        background: transparent;
        border: none;
        color: #f5d4d4;
        font-weight: 700;
        cursor: pointer;
        padding: 0;
      }

      .auth-actions {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 6px;
      }

      .subtle-link {
        text-align: center;
        color: var(--muted);
      }

      .subtle-link button {
        color: #f5d0d0;
        font-weight: 700;
        border: none;
        background: transparent;
        cursor: pointer;
      }

      .alert {
        display: none;
        width: 100%;
        border-radius: 12px;
        padding: 12px 14px;
        margin: 0 0 18px;
        font-weight: 600;
      }

      .alert.show { display: block; }
      .alert.error {
        background: rgba(213, 29, 29, 0.12);
        border: 1px solid rgba(213,29,29,0.5);
        color: #ffd4d4;
      }
      .alert.success {
        background: rgba(29, 213, 107, 0.08);
        border: 1px solid rgba(29, 213, 107, 0.35);
        color: #d5ffe8;
      }
      .alert.info {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.1);
        color: #e8e8e8;
      }

      .hidden { display: none !important; }

      .dashboard {
        padding-top: 14px;
      }

      .dashboard-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .dashboard-header h2 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.8rem);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-bottom: 22px;
      }

      .stat-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px 18px 16px;
      }

      .stat-label {
        color: var(--muted);
        display: block;
        font-size: 0.87rem;
        margin-bottom: 8px;
      }

      .stat-value {
        font-weight: 800;
        font-size: clamp(1.5rem, 3vw, 2.3rem);
      }

      .two-col {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 20px;
      }

      .card-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .info-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
      }

      .info-card h3,
      .info-card h4,
      .info-card h5 {
        margin: 0 0 12px;
      }

      .info-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255,255,255,0.04);
      }

      .info-row:last-child { border-bottom: 0; }

      .muted { color: var(--muted); }

      .account-code-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        margin-top: 14px;
      }

      .code-text {
        font-weight: 700;
        color: #f7d0d0;
        letter-spacing: 0.04em;
      }

      .claim-box {
        margin-top: 18px;
      }

      .list-item {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255,255,255,0.02);
        padding: 16px;
      }

      .list-item + .list-item { margin-top: 12px; }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 0.8rem;
        font-weight: 700;
        border: 1px solid rgba(255,255,255,0.1);
      }

      .badge.success { background: rgba(33, 147, 81, 0.12); color: #dfffe8; }
      .badge.warn { background: rgba(180, 155, 31, 0.12); color: #f9efad; }
      .badge.danger { background: rgba(213,29,29,0.12); color: #ffd6d6; }
      .badge.info { background: rgba(255,255,255,0.04); color: #e4e4e4; }

      .admin-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 22px 0 18px;
      }

      .tab-btn {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 700;
      }

      .tab-btn.active {
        background: linear-gradient(180deg, rgba(213,29,29,0.18), rgba(213,29,29,0.06));
        border-color: rgba(213,29,29,0.4);
      }

      .admin-section {
        display: none;
      }

      .admin-section.active { display: block; }

      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .toolbar input,
      .toolbar select {
        max-width: 220px;
      }

      .customers-table,
      .invoices-table,
      .products-table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 14px;
      }

      .customers-table th,
      .customers-table td,
      .invoices-table th,
      .invoices-table td,
      .products-table th,
      .products-table td {
        text-align: right;
        padding: 12px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        vertical-align: top;
      }

      .customers-table th,
      .invoices-table th,
      .products-table th {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .admin-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .compact {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .small-btn {
        padding: 8px 12px;
        font-size: 0.82rem;
      }

      .maintenance-modal {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(0,0,0,0.78);
        z-index: 1000;
        padding: 20px;
      }

      .maintenance-modal.show { display: grid; }

      .maintenance-box {
        width: min(520px, 100%);
        background: rgba(16,16,16,0.98);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
        padding: 28px;
        text-align: center;
      }

      .maintenance-box h3 { margin-top: 0; font-size: 2rem; }

      @media (max-width: 900px) {
        .auth-grid,
        .two-col,
        .stats-grid,
        .grid-2 {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .nav-actions {
          width: 100%;
          justify-content: flex-start;
        }
      }

      @media (max-width: 560px) {
        .container { width: min(92vw, 100%); }
        .panel { padding: 18px; }
        .brand-wrap { width: 100%; }
        .brand-name { letter-spacing: 0; }
        .hero-box { width: 78px; height: 78px; }
        .dashboard-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .customers-table,
        .invoices-table,
        .products-table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">D</div>
          <div class="brand-name">DATE PORTAL</div>
        </div>
        <div class="nav-actions" id="navActions"></div>
      </header>

      <main class="page-shell" id="app"></main>
    </div>

    <div id="maintenanceModal" class="maintenance-modal" aria-live="polite">
      <div class="maintenance-box">
        <h3>الموقع تحت الصيانة</h3>
        <p class="muted">تم إيقاف الوصول المؤقت من الإدارة، يرجى المحاولة لاحقًا.</p>
        <button class="btn" onclick="closeMaintenanceModal()">إغلاق</button>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'date_portal_state_v1';
      const ADMIN_SECRET_KEY = 'DATE_ADMIN_SECRET';

      const defaultProducts = [
        {
          id: 'prod-1',
          name: 'اشتراك احترافي',
          code: 'P-100',
          description: 'منتج احترافي مع بيانات الوصول المخصصة.',
          available: true,
          detailText: 'محتوى المنتج المخصص: بيانات الوصول خلال 24 ساعة.',
          link: 'https://example.com/product/p-100'
        },
        {
          id: 'prod-2',
          name: 'حزمة VIP',
          code: 'P-200',
          description: 'حزمة VIP مع بيانات مميزة وتحديثات خاصة.',
          available: true,
          detailText: 'تتضمن الحزمة VIP الوصول السريع إلى كل المحتوى.',
          link: 'https://example.com/product/p-200'
        },
        {
          id: 'prod-3',
          name: 'تجربة مختارة',
          code: 'P-300',
          description: 'نسخة تجريبية مختارة مع تفاصيل التسليم.',
          available: false,
          detailText: 'غير متاح حاليًا، سيتم تفعيله من الإدارة.',
          link: 'https://example.com/product/p-300'
        }
      ];

      function uid(prefix) {
        return `${prefix}-${Math.random().toString(36).slice(2, 10)}-${Date.now().toString(36)}`;
      }

      function makeCustomerCode() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let code = 'DATE-';
        for (let i = 0; i < 6; i++) {
          code += chars[Math.floor(Math.random() * chars.length)];
        }
        return code;
      }

      function deepClone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function getDefaultState() {
        return {
          users: [],
          products: deepClone(defaultProducts),
          invoices: [],
          announcements: [],
          auditLogs: [],
          settings: { maintenance: false },
          adminSecret: window[ADMIN_SECRET_KEY] || '',
        };
      }

      function getState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const state = getDefaultState();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return state;
        }

        try {
          const parsed = JSON.parse(raw);
          const base = getDefaultState();
          return {
            ...base,
            ...parsed,
            users: Array.isArray(parsed.users) ? parsed.users : [],
            products: Array.isArray(parsed.products) && parsed.products.length ? parsed.products : base.products,
            invoices: Array.isArray(parsed.invoices) ? parsed.invoices : [],
            announcements: Array.isArray(parsed.announcements) ? parsed.announcements : [],
            auditLogs: Array.isArray(parsed.auditLogs) ? parsed.auditLogs : [],
            settings: parsed.settings || base.settings,
            adminSecret: parsed.adminSecret || base.adminSecret,
          };
        } catch (err) {
          const state = getDefaultState();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return state;
        }
      }

      function saveState(nextState) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
      }

      function getCurrentUser() {
        const current = localStorage.getItem('date_portal_current_user');
        if (!current) return null;
        try {
          return JSON.parse(current);
        } catch {
          localStorage.removeItem('date_portal_current_user');
          return null;
        }
      }

      function setCurrentUser(user) {
        if (!user) {
          localStorage.removeItem('date_portal_current_user');
          return;
        }
        localStorage.setItem('date_portal_current_user', JSON.stringify(user));
      }

      function formatDate(dateString) {
        if (!dateString) return '—';
        const date = new Date(dateString);
        return isNaN(date.getTime()) ? '—' : date.toLocaleString('ar-SA');
      }

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, function (char) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          }[char];
        });
      }

      function renderNav() {
        const nav = document.getElementById('navActions');
        const user = getCurrentUser();

        if (!user) {
          nav.innerHTML = '<button class="btn" type="button" onclick="renderAuthScreen()">تسجيل الدخول</button>';
          return;
        }

        const adminBtn = user.role === 'admin' ? '<button class="btn secondary" type="button" onclick="renderAdminPanel()">لوحة الإدارة</button>' : '';
        nav.innerHTML = `
          <span class="muted">مرحبًا ${escapeHtml(user.username)}</span>
          <button class="btn secondary" type="button" onclick="renderCustomerDashboard()">لوحة العميل</button>
          ${adminBtn}
          <button class="btn danger" type="button" onclick="logoutUser()">تسجيل الخروج</button>
        `;
      }

      function showAlert(id, text, type = 'info') {
        const node = document.getElementById(id);
        if (!node) return;
        node.className = `alert show ${type}`;
        node.textContent = text;
      }

      function renderAuthScreen() {
        const app = document.getElementById('app');
        const state = getState();

        app.innerHTML = `
          <section class="hero">
            <div class="hero-box"><span>.D</span></div>
            <h1>مرحبًا بك في DATE</h1>
            <p class="hero-sub">سجّل دخولك للوصول إلى طلباتك واستلام فواتيرك.</p>
          </section>

          <section class="auth-grid">
            <div class="panel">
              <div class="panel-header">
                <h2>تسجيل الدخول</h2>
                <span class="mini-tag">DATE PORTAL</span>
              </div>

              <div id="loginAlert" class="alert" aria-live="polite"></div>

              <div class="field">
                <label for="loginUsername">اسم المستخدم</label>
                <input id="loginUsername" type="text" placeholder="أدخل اسم المستخدم" />
              </div>

              <div class="field">
                <label for="loginPassword">كلمة المرور</label>
                <div class="password-wrap">
                  <input id="loginPassword" type="password" placeholder="أدخل كلمة المرور" />
                  <button class="toggle-visibility" type="button" data-target="loginPassword" aria-label="إظهار كلمة المرور">👁</button>
                </div>
              </div>

              <div class="field">
                <div class="switch-row">
                  <button id="adminCodeToggle" class="simple-link" type="button">لديك تصريح؟</button>
                </div>
                <div id="adminCodeArea" class="admin-toggle-area">
                  <label for="adminCode">التصريح</label>
                  <input id="adminCode" type="password" placeholder="أدخل التصريح" />
                </div>
              </div>

              <div class="auth-actions">
                <button class="btn" type="button" onclick="loginUser()">تسجيل الدخول</button>
                <div class="subtle-link">
                  <span>ليس لديك حساب؟</span>
                  <button type="button" onclick="showRegisterForm()">أنشئ حسابًا</button>

      function loginUser() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const adminCode = document.getElementById('adminCode') ? document.getElementById('adminCode').value.trim() : '';

        if (!username || !password) {
          showAlert('loginAlert', 'يرجى إدخال اسم المستخدم وكلمة المرور.', 'error');
          return;
        }

        const state = getState();
        const user = state.users.find((item) => item.username.toLowerCase() === username.toLowerCase());

        if (!user) {
          showAlert('loginAlert', 'اسم المستخدم أو كلمة المرور غير صحيحة.', 'error');
          return;
        }

        if (user.password !== password) {
          showAlert('loginAlert', 'اسم المستخدم أو كلمة المرور غير صحيحة.', 'error');
          return;
        }

        if (user.status !== 'active') {
          showAlert('loginAlert', 'الحساب غير نشط أو تم إيقافه.', 'error');
          return;
        }

        const adminSecret = state.adminSecret || window.DATE_ADMIN_SECRET || '';
        const requestedAdmin = !!adminCode;
        if (requestedAdmin && adminSecret && adminCode !== adminSecret) {
          showAlert('loginAlert', 'التصريح غير صحيح.', 'error');
          return;
        }

        if (requestedAdmin && adminSecret && adminCode === adminSecret) {
          user.role = 'admin';
          user.adminAuthorizedAt = new Date().toISOString();
          saveState(state);
        }

        if (!requestedAdmin && user.role === 'admin') {
          showAlert('loginAlert', 'استخدم التصريح للوصول إلى لوحة الإدارة.', 'error');
          return;
        }

        setCurrentUser({ ...user });
        renderCustomerDashboard();
      }

      function registerUser() {
        const username = document.getElementById('registerUsername').value.trim();
        const password = document.getElementById('registerPassword').value;
        const confirm = document.getElementById('registerConfirm').value;

        if (!username || !password || !confirm) {
          showAlert('registerAlert', 'يرجى تعبئة جميع الحقول.', 'error');
          return;
        }

        if (password.length < 6) {
          showAlert('registerAlert', 'يجب أن تكون كلمة المرور 6 أحرف أو أكثر.', 'error');
          return;
        }

        if (password !== confirm) {
          showAlert('registerAlert', 'كلمة المرور وتأكيدها غير متطابقين.', 'error');
          return;
        }

        const state = getState();
        const exists = state.users.some((u) => u.username.toLowerCase() === username.toLowerCase());
        if (exists) {
          showAlert('registerAlert', 'اسم المستخدم موجود بالفعل.', 'error');
          return;

        const newUser = {

          createdAt: new Date().toISOString(),

        saveState(state);

        setCurrentUser({ ...newUser });
        showAlert('registerAlert', 'تم إنشاء الحساب بنجاح.', 'success');
        renderCustomerDashboard();

      function claimInvoiceFromCustomer() {
        const user = getCurrentUser();
        const lookup = document.getElementById('invoiceLookup')?.value.trim();

        if (!lookup) {
          showAlert('customerClaimAlert', 'يرجى إدخال رقم الفاتورة أو كود المنتج.', 'error');
          return;
        }

        const state = getState();
        const customer = state.users.find((item) => item.id === user.id);
        if (!customer) {
          showAlert('customerClaimAlert', 'الحساب غير موجود.', 'error');
          return;
        }

        const invoice = state.invoices.find((item) =>
          item.invoiceNumber === lookup ||
          item.code === lookup ||
          item.productCode === lookup
        );

        if (!invoice) {
          showAlert('customerClaimAlert', 'لا توجد فاتورة مطابقة، يرجى التحقق من البيانات.', 'error');
          return;
        }

        if (invoice.customerId !== customer.customerCode) {
          showAlert('customerClaimAlert', 'هذه الفاتورة لا تخص حسابك.', 'error');
          return;
        }

        if (invoice.status === 'claimed') {
          showAlert('customerClaimAlert', 'تم استلام هذه الفاتورة سابقًا في ' + formatDate(invoice.claimedAt) + '.', 'info');
          return;
        }

        if (invoice.status === 'cancelled') {
          showAlert('customerClaimAlert', 'هذه الفاتورة ملغاة ولا يمكن استلامها.', 'error');
          return;
        }

        const product = state.products.find((item) => item.id === invoice.productId || item.code === invoice.productCode);
        if (!product) {
          showAlert('customerClaimAlert', 'لا يوجد منتج مرتبط بهذه الفاتورة.', 'error');
          return;
        }

        invoice.status = 'claimed';
        invoice.claimedAt = new Date().toISOString();
        invoice.claimedBy = customer.username;
        invoice.claimHistory = invoice.claimHistory || [];
        invoice.claimHistory.push({
          username: customer.username,
          claimedAt: invoice.claimedAt,
          lookup
        });

        customer.claims = customer.claims || [];
        customer.claims.push({
          invoiceNumber: invoice.invoiceNumber,
          productCode: invoice.productCode,
          productName: product.name,
          claimedAt: invoice.claimedAt,
          status: 'claimed'
        });

        saveState(state);
        showAlert('customerClaimAlert', `تم استلام المنتج بنجاح: ${product.name}.`, 'success');
        renderCustomerDashboard();
      }

            <td>
              <div class="admin-actions">
                <button class="btn small-btn" type="button" onclick="toggleUserStatus('${user.id}')">${user.status === 'active' ? 'تعطيل' : 'تفعيل'}</button>
                <button class="btn secondary small-btn" type="button" onclick="adjustCustomerView('${user.id}')">فتح الملف</button>
              </div>
            </td>
          </tr>
        `).join('');

        return `
          <table class="customers-table">
            <thead>
              <tr>
                <th>اسم المستخدم</th>
                <th>كود العميل</th>
                <th>الدور</th>
                <th>الحالة</th>
                <th>تاريخ التسجيل</th>
                <th>النقاط</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody>${rows || '<tr><td colspan="7">لا يوجد مستخدمون.</td></tr>'}</tbody>
          </table>
        `;
      }

      function renderProductsTable(state) {
        return `
          <div style="margin-top:18px;">
            <table class="products-table">
              <thead>
                <tr>
                  <th>اسم المنتج</th>
                  <th>الكود</th>
                  <th>الوصف</th>
                  <th>الحالة</th>
                  <th>إجراءات</th>
                </tr>
              </thead>
              <tbody>
                ${state.products.map((product) => `
                  <tr>
                    <td>${escapeHtml(product.name)}</td>
                    <td>${escapeHtml(product.code)}</td>
                    <td>${escapeHtml(product.description)}</td>
                    <td>${product.available ? 'متاح' : 'غير متاح'}</td>
                    <td>
                      <div class="admin-actions">
                        <button class="btn small-btn" type="button" onclick="populateProductForm('${product.id}')">تعديل</button>
                        <button class="btn danger small-btn" type="button" onclick="deleteProduct('${product.id}')">حذف</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderInvoicesTable(state) {
        return `
          <div style="margin-top:18px;">
            <table class="invoices-table">
              <thead>
                <tr>
                  <th>رقم الفاتورة</th>
                  <th>العميل</th>
                  <th>المنتج</th>
                  <th>الحالة</th>
                  <th>تاريخ الإنشاء</th>
                  <th>إجراءات</th>
                </tr>
              </thead>
              <tbody>
                ${state.invoices.map((invoice) => `
                  <tr>
                    <td>${escapeHtml(invoice.invoiceNumber)}</td>
                    <td>${escapeHtml(invoice.customerId || '—')}</td>
                    <td>${escapeHtml(invoice.productName || '—')}</td>
                    <td>${escapeHtml(invoice.status || 'pending')}</td>
                    <td>${formatDate(invoice.createdAt)}</td>
                    <td>
                      <div class="admin-actions">
                        <button class="btn small-btn" type="button" onclick="cancelInvoice('${invoice.id}')">إلغاء</button>
                      </div>
                    </td>
                  </tr>
                `).join('') || '<tr><td colspan="6">لا توجد فواتير.</td></tr>'}
              </tbody>
            </table>
          </div>
        `;
      }

      function toggleUserStatus(userId) {
        const state = getState();
        const user = state.users.find((item) => item.id === userId);
        if (!user) return;

        user.status = user.status === 'active' ? 'inactive' : 'active';
        state.auditLogs.unshift({
          id: uid('audit'),
          actor: getCurrentUser().username,
          action: 'تغيير حالة العميل',
          details: `${user.username} -> ${user.status}`,
          createdAt: new Date().toISOString()
        });
        saveState(state);
        renderAdminPanel();
      }

      function adjustCustomerView(userId) {
        const state = getState();
        const user = state.users.find((item) => item.id === userId);
        if (!user) return;

        const details = {
          ...user,
          pointsLog: user.pointsLog || []
        };

        alert(`اسم المستخدم: ${details.username}\nالكود: ${details.customerCode}\nالنقاط: ${details.points || 0}\nعدد الطلبات: ${(details.claims || []).length}`);
      }

      function applyPointsAdjustment() {
        const rawCustomer = document.getElementById('loyaltyCustomerId')?.value.trim();
        const amount = Number(document.getElementById('loyaltyAmount')?.value);
        const reason = document.getElementById('loyaltyReason')?.value.trim() || 'تعديل يدوي';

        if (!rawCustomer || Number.isNaN(amount)) {
          alert('يرجى إدخال العميل وكمية النقاط بشكل صحيح.');
          return;
        }

        const state = getState();
        const customer = state.users.find((user) =>
          user.username.toLowerCase() === rawCustomer.toLowerCase() ||
          user.customerCode?.toLowerCase() === rawCustomer.toLowerCase()
        );

        if (!customer) {
          alert('لم يتم العثور على العميل.');
          return;
        }

        const nextBalance = Number(customer.points || 0) + amount;
        if (nextBalance < 0) {
          alert('لا يمكن أن يكون رصيد النقاط سالبًا.');
          return;
        }

        customer.points = Number(nextBalance.toFixed(2));
        customer.pointsLog = customer.pointsLog || [];
        customer.pointsLog.push({
          id: uid('point'),
          amount,
          reason,
          type: amount >= 0 ? 'earned' : 'deducted',
          actor: getCurrentUser().username,
          createdAt: new Date().toISOString()
        });

        state.auditLogs.unshift({
          id: uid('audit'),
          actor: getCurrentUser().username,
          action: 'تعديل نقاط الولاء',
          details: `${customer.username} | ${amount} | ${reason}`,
          createdAt: new Date().toISOString()
        });

        saveState(state);
        renderAdminPanel();
      }

      function saveProductFromForm() {
        const state = getState();
        const id = document.getElementById('productName')?.dataset.productId || uid('product');
        const name = document.getElementById('productName')?.value.trim();
        const code = document.getElementById('productCode')?.value.trim();
        const description = document.getElementById('productDescription')?.value.trim();
        const detailText = document.getElementById('productDetailText')?.value.trim();
        const link = document.getElementById('productLink')?.value.trim();
        const available = document.getElementById('productAvailability')?.value === 'true';

        if (!name || !code) {
          alert('يرجى إدخال اسم المنتج وكود المنتج.');
          return;
        }

        const existingIndex = state.products.findIndex((product) => product.code.toLowerCase() === code.toLowerCase());
        const productData = {
          id,
          name,
          code,
          description,
          detailText,
          link,
          available
        };

        if (existingIndex >= 0 && state.products[existingIndex].id !== id) {
          alert('هذا الكود موجود بالفعل، لا يمكن تكرار كود المنتج.');
          return;
        }

        const productIndex = state.products.findIndex((product) => product.id === id);
        if (productIndex >= 0) {
          state.products[productIndex] = productData;
        } else {
          state.products.push(productData);
        }

        state.auditLogs.unshift({
          id: uid('audit'),
          actor: getCurrentUser().username,
          action: 'تعديل المنتج',
          details: `${name} | ${code}`,
          createdAt: new Date().toISOString()
        });

        saveState(state);
        renderAdminPanel();
      }

      function populateProductForm(productId) {
        const state = getState();
        const product = state.products.find((item) => item.id === productId);
        if (!product) return;

        document.getElementById('productName').value = product.name;
        document.getElementById('productName').dataset.productId = product.id;
        document.getElementById('productCode').value = product.code;
        document.getElementById('productDescription').value = product.description;
        document.getElementById('productDetailText').value = product.detailText || '';
        document.getElementById('productLink').value = product.link || '';
        document.getElementById('productAvailability').value = String(Boolean(product.available));
      }

      function deleteProduct(productId) {
        if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
        const state = getState();
        state.products = state.products.filter((product) => product.id !== productId);
        saveState(state);
        renderAdminPanel();
      }

      function createInvoiceFromAdmin() {
        const state = getState();
        const customerCode = document.getElementById('invoiceCustomerId')?.value.trim();
        const productId = document.getElementById('invoiceProductSelect')?.value;
        const invoiceNumber = document.getElementById('invoiceNumber')?.value.trim();
        const invoiceStatus = document.getElementById('invoiceStatus')?.value || 'pending';
        const invoiceCode = document.getElementById('invoiceCode')?.value.trim();

        if (!customerCode || !productId || !invoiceNumber) {
          alert('يرجى إدخال كود العميل والمنتج ورقم الفاتورة.');
          return;
        }

        const customer = state.users.find((user) => user.customerCode?.toLowerCase() === customerCode.toLowerCase() || user.username.toLowerCase() === customerCode.toLowerCase());
        if (!customer) {
          alert('لم يتم العثور على العميل المحدد.');
          return;
        }

        const product = state.products.find((item) => item.id === productId);
        if (!product) {
          alert('هذا المنتج غير موجود.');
          return;
        }

        const duplicate = state.invoices.some((invoice) => invoice.invoiceNumber.toLowerCase() === invoiceNumber.toLowerCase());
        if (duplicate) {
          alert('رقم الفاتورة موجود بالفعل، خصص رقمًا فريدًا.');
          return;
        }

        const invoice = {
          id: uid('invoice'),
          invoiceNumber,
          code: invoiceCode || `RCPT-${Math.random().toString(36).slice(2, 8).toUpperCase()}`,
          customerId: customer.customerCode,
          customerName: customer.username,
          productId: product.id,
          productCode: product.code,
          productName: product.name,
          createdAt: new Date().toISOString(),
          status: invoiceStatus,
          isSingleUse: true,
          claimHistory: [],
          deliveryText: product.detailText || 'تم تجهيز الطلب بنجاح.'
        };

        state.invoices.push(invoice);
        state.auditLogs.unshift({
          id: uid('audit'),
          actor: getCurrentUser().username,
          action: 'إنشاء فاتورة',
          details: `${invoice.invoiceNumber} | ${customer.username} | ${product.name}`,
          createdAt: new Date().toISOString()
        });

        saveState(state);
        renderAdminPanel();
      }

      function cancelInvoice(invoiceId) {
        const state = getState();
        const invoice = state.invoices.find((item) => item.id === invoiceId);
        if (!invoice) return;

        invoice.status = 'cancelled';
        saveState(state);
        renderAdminPanel();
      }

      function publishAnnouncement() {
        const rawType = document.getElementById('messageTargetType')?.value || 'all';
        const targetUser = document.getElementById('messageTargetUser')?.value.trim();
        const message = document.getElementById('adminMessageText')?.value.trim();

        if (!message) {
          alert('يرجى كتابة نص الرسالة.');
          return;
        }

        const state = getState();
        const announcement = {
          id: uid('announcement'),
          scope: rawType,
          userId: rawType === 'user' ? (state.users.find((u) => u.username.toLowerCase() === targetUser.toLowerCase())?.id || null) : null,
          message,
          createdAt: new Date().toISOString()
        };

        state.announcements.push(announcement);
        saveState(state);
        renderAdminPanel();
      }

      function toggleMaintenanceMode() {
        const state = getState();
        state.settings.maintenance = !state.settings.maintenance;
        saveState(state);

        if (state.settings.maintenance) {
          renderMaintenanceOverlay();
        } else {
          closeMaintenanceModal();
        }

        renderAdminPanel();
      }

      function renderMaintenanceOverlay() {
        const modal = document.getElementById('maintenanceModal');
        if (modal) modal.classList.add('show');
      }

      function closeMaintenanceModal() {
        const modal = document.getElementById('maintenanceModal');
        if (modal) modal.classList.remove('show');
      }

      function attachGlobalShortcuts() {
        document.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') {
            const active = document.activeElement && document.activeElement.tagName;
            if (active === 'INPUT' || active === 'TEXTAREA') {
              const forms = ['loginUsername', 'loginPassword', 'registerUsername', 'registerPassword', 'registerConfirm'];
              if (forms.includes(document.activeElement.id)) {
                loginUser();
              }
            }
          }
        });
      }

      function initApp() {
        const current = getCurrentUser();
        const state = getState();

        if (!state.users.length) {
          renderAuthScreen();
          return;
        }

        if (current) {
          const found = state.users.find((user) => user.id === current.id);
          if (found) {
            renderCustomerDashboard();
            return;
          }
        }

        renderAuthScreen();
      }

      initApp();
    </script>
  </body>
</html>
