<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DATE Portal</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --panel-2: #1a2438;
        --line: #2b3a52;
        --text: #e5edf8;
        --muted: #9db0ca;
        --primary: #3b82f6;
        --primary-2: #60a5fa;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Tahoma, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 18px 60px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 18px 20px;
        border-radius: 16px;
        background: rgba(18, 26, 43, 0.95);
        border: 1px solid var(--line);
        margin-bottom: 20px;
      }

      .brand {
        font-size: 1.8rem;
        font-weight: 700;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        border: none;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        transition: 0.2s ease;
        color: white;
        background: var(--primary);
      }

      .btn:hover { filter: brightness(1.05); }
      .btn.secondary { background: #334155; }
      .btn.success { background: var(--success); }
      .btn.warning { background: var(--warning); color: #111827; }
      .btn.danger { background: var(--danger); }

      .panel, .auth-box {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 16px 36px rgba(0,0,0,0.18);
      }

      .auth-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-weight: 700;
      }

      input, select {
        width: 100%;
        background: #0f172a;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        padding: 12px 14px;
        font-size: 15px;
      }

      input:focus, select:focus {
        outline: 2px solid rgba(59,130,246,0.35);
        border-color: var(--primary-2);
      }

      .alert {
        display: none;
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 14px;
      }

      .alert.show { display: block; }
      .alert.error {
        background: rgba(239,68,68,0.12);
        border: 1px solid rgba(239,68,68,0.5);
        color: #fecaca;
      }
      .alert.success {
        background: rgba(34,197,94,0.12);
        border: 1px solid rgba(34,197,94,0.5);
        color: #bbf7d0;
      }
      .alert.info {
        background: rgba(59,130,246,0.12);
        border: 1px solid rgba(59,130,246,0.5);
        color: #bfdbfe;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 20px;
      }

      .stat {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 14px;
        text-align: center;
      }

      .stat strong {
        display: block;
        font-size: 2rem;
        margin-bottom: 8px;
      }

      .card-list {
        display: grid;
        gap: 14px;
      }

      .user-card {
        background: #0f172a;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }

      .status {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        margin-right: 8px;
      }

      .status.active { background: rgba(34,197,94,0.15); color: #bbf7d0; }
      .status.suspended { background: rgba(245,158,11,0.15); color: #fcd34d; }
      .status.deleted { background: rgba(239,68,68,0.15); color: #fecaca; }

      .inline-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .muted { color: var(--muted); }
      .message-box {
        margin-top: 16px;
        background: #0f172a;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
      }

      .product-box {
        background: #0f172a;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
      }

      .maintenance {
        position: fixed;
        inset: 0;
        background: rgba(2,6,23,0.9);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 999;
      }

      .maintenance.show { display: flex; }
      .maintenance-box {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 30px 24px;
        max-width: 480px;
        width: 100%;
        text-align: center;
      }

      @media (max-width: 820px) {
        .auth-grid { grid-template-columns: 1fr; }
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="topbar">
        <div class="brand">DATE Portal</div>
        <div id="nav" class="nav"></div>
      </header>

      <main id="app"></main>
    </div>

    <div id="maintenanceModal" class="maintenance">
      <div class="maintenance-box">
        <h2>الموقع تحت الصيانة</h2>
        <p class="muted">تم إيقاف الموقع مؤقتًا من الإدارة، يرجى المحاولة لاحقًا.</p>
        <button class="btn" onclick="closeMaintenance()">إغلاق</button>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'date_portal_state_v1';
      const CURRENT_USER_KEY = 'date_portal_current_user';
      const ADMIN_SECRET = 'DATE-4IG84N';

      const defaultProducts = [
        { id: 'prod-1', name: 'اشتراك احترافي', code: 'P-100', description: 'منتج احترافي مع بيانات الوصول المخصصة.', available: true, detailText: 'محتوى المنتج المخصص: بيانات الوصول خلال 24 ساعة.', link: 'https://example.com/product/p-100' },
        { id: 'prod-2', name: 'حزمة VIP', code: 'P-200', description: 'حزمة VIP مع بيانات مميزة وتحديثات خاصة.', available: true, detailText: 'تتضمن الحزمة VIP الوصول السريع إلى كل المحتوى.', link: 'https://example.com/product/p-200' },
        { id: 'prod-3', name: 'تجربة مختارة', code: 'P-300', description: 'نسخة تجريبية مختارة مع تفاصيل التسليم.', available: false, detailText: 'غير متاح حاليًا، سيتم تفعيله من الإدارة.', link: 'https://example.com/product/p-300' }
      ];

      function clone(value) { return JSON.parse(JSON.stringify(value)); }

      function getState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          const state = {
            users: [
              { id: 1, username: 'admin', password: 'admin123', role: 'admin', status: 'active', points: 0, message: 'مرحبا الإدارة', claims: [] },
              { id: 2, username: 'demo', password: 'demo123', role: 'user', status: 'active', points: 0, message: '', claims: [] }
            ],
            products: clone(defaultProducts),
            invoices: [],
            announcements: [],
            auditLogs: [],
            settings: { maintenance: false }
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return state;
        }

        try {
          const state = JSON.parse(raw);
          state.users = Array.isArray(state.users) ? state.users : [];
          state.products = Array.isArray(state.products) && state.products.length ? state.products : clone(defaultProducts);
          state.invoices = Array.isArray(state.invoices) ? state.invoices : [];
          state.announcements = Array.isArray(state.announcements) ? state.announcements : [];
          state.auditLogs = Array.isArray(state.auditLogs) ? state.auditLogs : [];
          state.settings = state.settings || { maintenance: false };
          return state;
        } catch (e) {
          const state = {
            users: [
              { id: 1, username: 'admin', password: 'admin123', role: 'admin', status: 'active', points: 0, message: 'مرحبا الإدارة', claims: [] },
              { id: 2, username: 'demo', password: 'demo123', role: 'user', status: 'active', points: 0, message: '', claims: [] }
            ],
            products: clone(defaultProducts),
            invoices: [],
            announcements: [],
            auditLogs: [],
            settings: { maintenance: false }
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          return state;
        }
      }

      function saveState(nextState) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
      }

      function getCurrentUser() {
        const raw = localStorage.getItem(CURRENT_USER_KEY);
        return raw ? JSON.parse(raw) : null;
      }

      function setCurrentUser(user) {
        if (!user) localStorage.removeItem(CURRENT_USER_KEY);
        else localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
      }

      function renderNav() {
        const nav = document.getElementById('nav');
        const user = getCurrentUser();

        if (!user) {
          nav.innerHTML = '<button class="btn" onclick="renderAuth()">تسجيل الدخول</button>';
          return;
        }

        nav.innerHTML = `
          <span class="muted">مرحبا ${user.username}</span>
          <button class="btn secondary" onclick="renderDashboard()">الرئيسية</button>
          ${user.role === 'admin' ? '<button class="btn warning" onclick="renderAdmin()">لوحة الإدارة</button>' : ''}
          <button class="btn danger" onclick="logout()">تسجيل الخروج</button>
        `;
      }

      function showMessage(elementId, text, type) {
        const el = document.getElementById(elementId);
        if (!el) return;
        el.className = 'alert show ' + type;
        el.textContent = text;
      }

      function renderAuth() {
        const app = document.getElementById('app');
        const state = getState();

        if (state.settings.maintenance && (!getCurrentUser() || getCurrentUser().role !== 'admin')) {
          renderMaintenanceOverlay();
          return;
        }

        app.innerHTML = `
          <section class="auth-grid">
            <div class="auth-box">
              <h2>تسجيل الدخول</h2>
              <div id="loginAlert" class="alert"></div>
              <div class="form-group">
                <label class="label">اسم المستخدم</label>
                <input id="loginUsername" type="text" placeholder="اسم المستخدم" />
              </div>
              <div class="form-group">
                <label class="label">كلمة المرور</label>
                <input id="loginPassword" type="password" placeholder="كلمة المرور" />
              </div>
              <button class="btn" onclick="login()">دخول</button>
            </div>

            <div class="auth-box">
              <h2>إنشاء حساب</h2>
              <div id="registerAlert" class="alert"></div>
              <div class="form-group">
                <label class="label">اسم المستخدم</label>
                <input id="regUsername" type="text" placeholder="اسم المستخدم" />
              </div>
              <div class="form-group">
                <label class="label">كلمة المرور</label>
                <input id="regPassword" type="password" placeholder="كلمة المرور" />
              </div>
              <div class="form-group">
                <label class="label">تأكيد كلمة المرور</label>
                <input id="regConfirm" type="password" placeholder="تأكيد كلمة المرور" />
              </div>
              <div class="form-group">
                <label class="label">كود الإدارة (اختياري)</label>
                <input id="regInvite" type="text" placeholder="اكتب كود الإدارة إن وجد" />
              </div>
              <button class="btn success" onclick="register()">إنشاء الحساب</button>
            </div>
          </section>
        `;

        renderNav();
      }

      function login() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const state = getState();
        const user = state.users.find(u => u.username === username && u.password === password);

        if (!user) {
          showMessage('loginAlert', 'اسم المستخدم أو كلمة المرور غير صحيحة', 'error');
          return;
        }

        if (user.status === 'suspended') {
          showMessage('loginAlert', 'حسابك تم إيقافه من الإدارة', 'error');
          return;
        }

        if (user.status === 'deleted') {
          showMessage('loginAlert', 'هذا الحساب تم حذفه', 'error');
          return;
        }

        if (state.settings.maintenance && user.role !== 'admin') {
          renderMaintenanceOverlay();
          return;
        }

        setCurrentUser(user);
        renderDashboard();
      }

      function register() {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        const invite = document.getElementById('regInvite').value.trim();

        if (!username || !password || !confirm) {
          showMessage('registerAlert', 'يرجى تعبئة جميع الحقول', 'error');
          return;
        }

        if (password !== confirm) {
          showMessage('registerAlert', 'كلمة المرور وتأكيدها غير متطابقين', 'error');
          return;
        }

        const state = getState();
        if (state.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
          showMessage('registerAlert', 'اسم المستخدم موجود بالفعل', 'error');
          return;
        }

        const role = invite === ADMIN_SECRET ? 'admin' : 'user';
        state.users.push({
          id: Date.now(),
          username,
          password,
          role,
          status: 'active',
          points: 0,
          message: '',
          claims: []
        });

        saveState(state);
        setCurrentUser(state.users[state.users.length - 1]);
        renderDashboard();
      }

      function logout() {
        setCurrentUser(null);
        renderAuth();
      }

      function renderDashboard() {
        const user = getCurrentUser();
        const state = getState();

        if (!user) {
          renderAuth();
          return;
        }

        if (state.settings.maintenance && user.role !== 'admin') {
          renderMaintenanceOverlay();
          return;
        }

        const productOptions = state.products.map(p => `<option value="${p.code}">${p.code}</option>`).join('');

        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>لوحة المستخدم</h2>
            <p>مرحبًا: <strong>${user.username}</strong></p>
            <p>عدد نقاطك: <strong>${Number(user.points || 0).toFixed(2)}</strong></p>

            <div class="auth-grid">
              <div>
                <div class="form-group">
                  <label class="label">رقم الفاتورة</label>
                  <input id="invoiceNumber" type="text" placeholder="مثال: 1001" />
                </div>
                <div class="form-group">
                  <label class="label">كود المنتج</label>
                  <select id="productCode">
                    <option value="">اختر المنتج</option>
                    ${productOptions}
                  </select>
                </div>
                <button class="btn success" onclick="claimProduct()">تأكيد</button>
              </div>

              <div class="product-box">
                <h3>معلومات المنتج</h3>
                <div id="productInfo">اختر كود المنتج لمعرفة التفاصيل.</div>
              </div>
            </div>

            <div id="claimAlert" class="alert"></div>
            <div class="message-box">
              <strong>رسالة الإدارة:</strong>
              <div>${user.message || 'لا توجد رسالة حالياً.'}</div>
            </div>
          </section>
        `;

        const productSelect = document.getElementById('productCode');
        productSelect.addEventListener('change', function () {
          const code = this.value;
          const product = state.products.find(p => p.code === code);
          const info = document.getElementById('productInfo');
          if (!product) {
            info.innerHTML = 'اختر كود المنتج';
            return;
          }

          info.innerHTML = `
            <p><strong>اسم المنتج:</strong> ${product.name}</p>
            <p><strong>الوصف:</strong> ${product.description}</p>
            <p><strong>التفاصيل:</strong> ${product.detailText}</p>
            <p><strong>الرابط:</strong> <a href="${product.link}" target="_blank" style="color:#60a5fa;">${product.link}</a></p>
          `;
        });

        renderNav();
      }

      function claimProduct() {
        const user = getCurrentUser();
        if (!user) return;

        const invoiceNumber = document.getElementById('invoiceNumber').value.trim();
        const productCode = document.getElementById('productCode').value.trim();
        const state = getState();

        if (!invoiceNumber || !productCode) {
          showMessage('claimAlert', 'يرجى إدخال رقم الفاتورة واختيار المنتج', 'error');
          return;
        }

        const userIndex = state.users.findIndex(u => u.id === user.id);
        if (userIndex < 0) {
          showMessage('claimAlert', 'المستخدم غير موجود', 'error');
          return;
        }

        const product = state.products.find(p => p.code === productCode);
        if (!product) {
          showMessage('claimAlert', 'هذا المنتج غير موجود', 'error');
          return;
        }

        const alreadyClaimed = state.users[userIndex].claims.some(c => c.invoiceNumber === invoiceNumber && c.productCode === productCode);
        if (alreadyClaimed) {
          showMessage('claimAlert', 'تم استخدام هذه الفاتورة من قبل ولا يمكن تكرارها', 'error');
          return;
        }

        const rewardPoints = Number((Math.random() * 2.5 + 0.1).toFixed(2));
        state.users[userIndex].points = Number((Number(state.users[userIndex].points || 0) + rewardPoints).toFixed(2));
        state.users[userIndex].claims.push({ invoiceNumber, productCode, points: rewardPoints, time: new Date().toISOString() });
        state.invoices.push({ invoiceNumber, productCode, username: state.users[userIndex].username, time: new Date().toISOString() });
        saveState(state);
        setCurrentUser(state.users[userIndex]);

        const info = document.getElementById('productInfo');
        info.innerHTML = `
          <p>تم التحقق بنجاح.</p>
          <p>النقاط المضافة: <strong>${rewardPoints}</strong></p>
          <p>المنتج: <strong>${product.name}</strong></p>
          <p>الرابط: <a href="${product.link}" target="_blank" style="color:#60a5fa;">${product.link}</a></p>
        `;

        showMessage('claimAlert', `تمت العملية بنجاح! تم إضافة ${rewardPoints} نقطة.`, 'success');
      }

      function renderAdmin() {
        const user = getCurrentUser();
        if (!user || user.role !== 'admin') {
          renderAuth();
          return;
        }

        const state = getState();
        const cards = state.users.map(u => `
          <div class="user-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <strong>${u.username}</strong>
                <span class="status ${u.status || 'active'}">${u.status || 'active'}</span>
              </div>
              <div>النقاط: <strong>${Number(u.points || 0).toFixed(2)}</strong></div>
            </div>
            <p class="muted">الدور: ${u.role}</p>
            <p class="muted">الرسالة: ${u.message || 'لا يوجد'}</p>
            <div class="inline-actions">
              <button class="btn secondary" onclick="toggleUserStatus(${u.id})">${u.status === 'suspended' ? 'تفعيل' : 'إيقاف'}</button>
              <button class="btn warning" onclick="givePoints(${u.id})">إعطاء نقاط</button>
              <button class="btn success" onclick="setUserMessage(${u.id})">رسالة</button>
              <button class="btn danger" onclick="deleteUser(${u.id})">حذف</button>
            </div>
          </div>
        `).join('');

        document.getElementById('app').innerHTML = `
          <section class="panel">
            <h2>لوحة الإدارة</h2>
            <div class="stats">
              <div class="stat"><strong>${state.users.filter(u => u.status === 'active').length}</strong> مستخدمين نشطين</div>
              <div class="stat"><strong>${state.users.length}</strong> إجمالي الحسابات</div>
              <div class="stat"><strong>${state.invoices.length}</strong> عدد الفواتير</div>
              <div class="stat"><strong>${state.settings.maintenance ? 'موقوف' : 'مفتوح'}</strong> حالة الموقع</div>
            </div>

            <div class="inline-actions" style="margin-bottom: 18px;">
              <button class="btn" onclick="toggleMaintenance()">تبديل حالة الموقع</button>
              <button class="btn secondary" onclick="renderDashboard()">عودة للوحة المستخدم</button>
            </div>

            <div class="card-list">${cards}</div>
          </section>
        `;

        renderNav();
      }

      function toggleUserStatus(id) {
        const state = getState();
        const index = state.users.findIndex(u => u.id === id);
        if (index < 0) return;
        state.users[index].status = state.users[index].status === 'suspended' ? 'active' : 'suspended';
        saveState(state);
        renderAdmin();
      }

      function givePoints(id) {
        const value = Number(prompt('أدخل عدد النقاط:', '0.5'));
        if (!Number.isFinite(value) || value <= 0) return;

        const state = getState();
        const index = state.users.findIndex(u => u.id === id);
        if (index < 0) return;

        state.users[index].points = Number((Number(state.users[index].points || 0) + value).toFixed(2));
        state.users[index].message = `تمت إضافة ${value} نقطة من الإدارة`;
        saveState(state);
        renderAdmin();
      }

      function setUserMessage(id) {
        const msg = prompt('اكتب رسالة الإدارة:');
        if (msg === null) return;

        const state = getState();
        const index = state.users.findIndex(u => u.id === id);
        if (index < 0) return;

        state.users[index].message = msg;
        saveState(state);
        renderAdmin();
      }

      function deleteUser(id) {
        if (!confirm('هل أنت متأكد من حذف هذا الحساب؟')) return;

        const state = getState();
        state.users = state.users.filter(u => u.id !== id);
        saveState(state);

        const current = getCurrentUser();
        if (current && current.id === id) {
          setCurrentUser(null);
          renderAuth();
          return;
        }

        renderAdmin();
      }

      function toggleMaintenance() {
        const state = getState();
        state.settings.maintenance = !state.settings.maintenance;
        saveState(state);
        if (state.settings.maintenance) renderMaintenanceOverlay();
        else closeMaintenance();
        renderAdmin();
      }

      function renderMaintenanceOverlay() {
        document.getElementById('maintenanceModal').classList.add('show');
      }

      function closeMaintenance() {
        document.getElementById('maintenanceModal').classList.remove('show');
      }

      function init() {
        const current = getCurrentUser();
        const state = getState();

        if (!current) {
          renderAuth();
          return;
        }

        if (state.settings.maintenance && current.role !== 'admin') {
          renderMaintenanceOverlay();
          return;
        }

        renderDashboard();
      }

      init();
    </script>
  </body>
</html>
